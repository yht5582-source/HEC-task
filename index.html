<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>衛教室戰情室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f3f6;--surface:#ffffff;--surface-2:#e8ecf1;--ink:#16202a;--ink-2:#4a5664;--ink-3:#788493;--line:#d9dfe6;
  --accent:#2b5d8a;--accent-ink:#ffffff;--accent-soft:#e0e9f4;
  --ok:#2b7549;--ok-soft:#e1f0e5;--warn:#9d5f14;--warn-soft:#fbecd6;--crit:#b3362c;--crit-soft:#f8e0dc;
  --info:#2c5b8a;--info-soft:#e0eaf5;--off:#6d7671;--off-soft:#e6e9e4;--duty:#65488f;--duty-soft:#ebe4f5;
  --c1:#2b5d8a;--c2:#7db69b;--c3:#c98a2e;--c4:#2c6955;--c5:#9a5b8c;--c6:#a1aaa4;--c7:#b85b45;--c8:#4f8c8c;
  --sans:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715;--surface:#19211e;--surface-2:#212a27;--ink:#e5ebe8;--ink-2:#a8b5b0;--ink-3:#78867f;--line:#2b3632;
  --accent:#86b3e3;--accent-ink:#0f1824;--accent-soft:#1b2c40;
  --ok:#72c894;--ok-soft:#1b3325;--warn:#e3a75a;--warn-soft:#3a2b16;--crit:#f08b7f;--crit-soft:#3e201c;
  --info:#86b3e3;--info-soft:#1a2b3e;--off:#9aa39e;--off-soft:#252d2a;--duty:#bba1e3;--duty-soft:#2b2339;
  --c1:#86b3e3;--c2:#3f8a6c;--c3:#e3a75a;--c4:#6fc2a3;--c5:#cf8fc0;--c6:#7d8883;--c7:#ec8b73;--c8:#72b8b8;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111715;--surface:#19211e;--surface-2:#212a27;--ink:#e5ebe8;--ink-2:#a8b5b0;--ink-3:#78867f;--line:#2b3632;
  --accent:#86b3e3;--accent-ink:#0f1824;--accent-soft:#1b2c40;
  --ok:#72c894;--ok-soft:#1b3325;--warn:#e3a75a;--warn-soft:#3a2b16;--crit:#f08b7f;--crit-soft:#3e201c;
  --info:#86b3e3;--info-soft:#1a2b3e;--off:#9aa39e;--off-soft:#252d2a;--duty:#bba1e3;--duty-soft:#2b2339;
  --c1:#86b3e3;--c2:#3f8a6c;--c3:#e3a75a;--c4:#6fc2a3;--c5:#cf8fc0;--c6:#7d8883;--c7:#ec8b73;--c8:#72b8b8;
  color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:24px;padding-block:0 56px}
@media (max-width:640px){.wrap{padding-inline:16px}}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px 14px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--ink-3)}
h1{font-family:var(--serif);font-size:28px;line-height:1.2;margin:2px 0 0;letter-spacing:.04em}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-2);font-size:13px}
.sync{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.live i{background:var(--ok)} .sync.local i{background:var(--warn)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:12px 14px 11px;color:var(--ink-2);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.idbox{margin-top:14px;padding:14px 16px;border-radius:10px;background:var(--accent-soft);color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.idbox b{color:var(--accent)}
.banner{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px}

/* generic */
main{display:grid;gap:18px;padding-top:18px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar .grow{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover:not(:disabled){filter:brightness(1.07)}
.btn.icon{padding:6px 10px;min-width:34px}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.45}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:6px;padding:5px 11px;color:var(--ink-2);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.field{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-height:34px}
.field:disabled{opacity:.6}
.datebig{font-size:16px;font-weight:600;letter-spacing:.02em;min-width:9.5em}
.link{border:0;background:none;padding:0;color:inherit;text-align:left}
.link:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:"IBM Plex Sans",var(--sans)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px 10px;flex-wrap:wrap}
.ph h2{font-size:15px;margin:0;font-weight:700}
.ph .hint{font-size:12px;color:var(--ink-3)}
.pb{padding:0 16px 16px}
.scroll{overflow-x:auto}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:980px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 13px;min-width:0}
.kl{font-size:12px;color:var(--ink-2)}
.kv{font:600 28px/1.15 "IBM Plex Sans",var(--sans);font-variant-numeric:tabular-nums;margin-top:4px;letter-spacing:-.01em}
.kv small{font-size:15px;color:var(--ink-3);font-weight:500;margin-left:2px}
.ks{font-size:12px;color:var(--ink-3);margin-top:3px;min-height:1.5em;overflow-wrap:anywhere}
.kpi.crit .kv{color:var(--crit)} .kpi.crit{border-color:color-mix(in srgb,var(--crit) 35%,var(--line))}

/* tables */
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--ink-3);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tfoot td{border-top:1px solid var(--line);border-bottom:0;font-weight:600;background:var(--surface-2)}
.tbl th.num{text-align:right}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.who{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.who .nm{font-weight:600;font-size:15px}
.role{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:600;letter-spacing:.05em}
.role.plain{background:var(--surface-2);color:var(--ink-2);font-weight:500}
.mini{font-size:12px;color:var(--ink-3);white-space:nowrap}
.zero{color:var(--ink-3)}
.bad{color:var(--crit);font-weight:600}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;border:0;background:var(--surface-2);color:var(--ink-2);line-height:1.6}
button.chip:hover:not(:disabled){box-shadow:inset 0 0 0 1px currentColor}
.k-ok{background:var(--ok-soft);color:var(--ok)}
.k-warn,.k-leave,.k-half{background:var(--warn-soft);color:var(--warn)}
.k-crit,.k-sick{background:var(--crit-soft);color:var(--crit)}
.k-info,.k-official{background:var(--info-soft);color:var(--info)}
.k-off{background:var(--off-soft);color:var(--off)}
.k-duty{background:var(--duty-soft);color:var(--duty)}
.tasks-inline{display:flex;flex-wrap:wrap;gap:6px}
.tchip{display:inline-flex;gap:6px;align-items:baseline;max-width:260px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:12px;text-align:left}
.tchip span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tchip .d{color:var(--ink-3);flex:none}
.tchip.over{border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.tchip.over .d{color:var(--crit);font-weight:600}
.tchip:hover{border-color:var(--ink-3)}

/* attendance grid */
.ag{border-collapse:separate;border-spacing:0;min-width:100%}
.ag th,.ag td{padding:3px 2px;text-align:center;border-bottom:1px solid var(--line)}
.ag th{font-size:11px;color:var(--ink-3);font-weight:500}
.ag th.first,.ag td.first{text-align:left;padding-left:10px;padding-right:10px;position:sticky;left:0;background:var(--surface);z-index:1;white-space:nowrap}
.ag .we{background:var(--surface-2)}
.ag th.first.we{background:var(--surface)}
.ag .dh{border:0;background:none;padding:2px 0;display:flex;flex-direction:column;align-items:center;line-height:1.2;width:100%;border-radius:6px;color:inherit}
.ag .dh b{font-size:12px;color:var(--ink-2);font-weight:600}
.ag .dh:hover:not(:disabled){background:var(--accent-soft)}
.ag th.today .dh b{color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:0 4px}
.ac{width:28px;height:28px;border-radius:6px;border:0;font-size:12px;font-weight:600;padding:0}
.ac.imp{background:transparent;color:var(--ink-3);font-weight:400}
.ac:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--accent)}
.ac.pend{outline:1.5px dashed var(--warn);outline-offset:-3px;color:var(--warn)}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:13px}
div.checks label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--ink)}
.checks input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-weight:600;margin-left:5px;vertical-align:1px}
.prog{height:4px;width:72px;background:var(--surface-2);border-radius:2px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.demo{font-size:11px;padding:0 6px;border-radius:4px;border:1px dashed var(--ink-3);color:var(--ink-3);margin-left:6px;vertical-align:1px;font-weight:400}
.ag td.na{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px)}
.ag td.sum{font-variant-numeric:tabular-nums;font-size:13px;padding-inline:10px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .ac{width:20px;height:20px;font-size:11px;display:inline-grid;place-items:center}

/* volume inputs */
.vin{width:64px;text-align:right;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px;font-variant-numeric:tabular-nums}
.vin:focus{background:var(--surface);border-color:var(--accent);outline:none}
.vin::placeholder{color:var(--ink-3)}
.dim td{opacity:.55}

/* charts */
.bars{display:flex;align-items:flex-end;gap:2px;height:150px;padding-top:6px;border-bottom:1px solid var(--line);position:relative}
.bars .b{flex:1;min-width:2px;background:var(--c1);border-radius:3px 3px 0 0;position:relative}
.bars .b.we{background:color-mix(in srgb,var(--c1) 40%,transparent)}
.bars .b:hover{filter:brightness(1.15)}
.bars .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);pointer-events:none}
.bars .gl span{position:absolute;right:0;top:-16px;font-size:11px;color:var(--ink-3);background:var(--surface);padding-left:4px}
.xl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:4px}
.hbar{display:grid;grid-template-columns:5.5em minmax(0,1fr) 3.5em;gap:10px;align-items:center;margin-bottom:8px;font-size:13px}
.hbar .track{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.hbar .track i{display:block;height:100%}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* attention list */
.alist{display:grid;gap:4px}
.aitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:8px 8px;border-radius:8px;width:100%}
.aitem:hover{background:var(--surface-2)}
.aitem .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.aitem .s{font-size:12px;color:var(--ink-3);white-space:nowrap}
.agroup{font-size:12px;color:var(--ink-3);padding:10px 8px 2px;letter-spacing:.05em}
.empty{padding:22px 16px;text-align:center;color:var(--ink-3);font-size:13px}

/* done list */
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.dl h3{font-size:13px;margin:0 0 6px;display:flex;justify-content:space-between}
.dl ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.dl li{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.dl li span:last-child{color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}

/* menu, modal, toast */
#menu{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;width:236px}
#menu .mh{font-size:12px;color:var(--ink-3);padding:2px 4px 8px}
#menu .mg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
#menu .mg button{justify-content:flex-start;border-radius:6px;padding:6px 8px;font-size:13px}
#menu .mg button.cur{box-shadow:inset 0 0 0 1.5px currentColor}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,16,14,.42);display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet h2{margin:0 0 14px;font-size:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--ink-2)}
.form .full{grid-column:1/-1}
.form .field{width:100%;color:var(--ink);font-size:14px}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.actions .grow{flex:1}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:70;max-width:calc(100% - 32px)}
.note{font-size:12px;color:var(--ink-3);line-height:1.7}
.set-row input.field,.set-row select.field{width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.gate{max-width:440px;margin:56px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.gate h2{margin:0 0 6px;font-size:18px}
.gate p{color:var(--ink-2);margin:0 0 14px;line-height:1.7}
.gate .field{width:100%;margin-bottom:10px;font-size:15px}
.gate .btn{width:100%;padding:9px 12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">門診衛教室・任務與業務量管理</div>
      <h1>衛教室戰情室</h1>
    </div>
    <div class="meta"><span id="bell"></span><span id="roleLbl"></span><span id="sync" class="sync"><i></i><span>連線中</span></span><span id="todayLbl"></span></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div id="banner"></div>
  <main id="main" aria-live="polite"></main>
</div>
<div id="menu" hidden role="menu"></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ---------- 日期工具 ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const TODAY=ymd(new Date());
const WD='日一二三四五六';
const dow=s=>parse(s).getDay();
const isWE=s=>{const w=dow(s);return w===0||w===6};
const wd=s=>WD[dow(s)];
const md=s=>s?`${+s.slice(5,7)}/${+s.slice(8)}`:'—';
const mdy=s=>!s?'—':(s.slice(0,4)===TODAY.slice(0,4)?md(s):`${s.slice(0,4)}/${md(s)}`);
const longDate=s=>`${s.slice(0,4)}/${s.slice(5,7)}/${s.slice(8)}（${wd(s)}）`;
const monthEnd=m=>{const[y,mo]=m.split('-').map(Number);return `${m}-${pad(new Date(y,mo,0).getDate())}`};
const addMonths=(m,n)=>{const[y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const nf=n=>Number.isInteger(n)?String(n):n.toFixed(1);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- 代碼表 ---------- */
const TASK_ST={plan:{l:'規劃中',k:'off'},todo:{l:'未開始',k:'info'},doing:{l:'進行中',k:'warn'},done:{l:'已完成',k:'ok'}};
const TASK_CAT=['糖尿病照護','DKD','戒菸','結核病/LTBI','病友會','社區衛教','教學訓練','申報/行政','品質','其他'];
const TASK_SRC={assigned:{l:'負責人指派',k:'info'},claimed:{l:'自願認領',k:'duty'},self:{l:'自行提出',k:'ok'}};
const isVoluntary=t=>t.source==='claimed'||t.source==='self';
const taskKind=t=>!t.staffId||!S.staff[t.staffId]?'pool':isVoluntary(t)?'vol':'assigned';

function volDay(d,sid){const v=S.months[d.slice(0,7)]?.vol?.[d]?.[sid]||{};return S.cats.reduce((a,c)=>a+(Number(v[c.id])||0),0)}
function volAgg(from,to){
  const out={by:{},day:{},cat:{},total:0};
  for(const [m,doc] of Object.entries(S.months)){
    if(m<from.slice(0,7)||m>to.slice(0,7))continue;
    for(const [d,per] of Object.entries(doc.vol||{})){
      if(d<from||d>to)continue;
      for(const [sid,v] of Object.entries(per||{})){
        for(const c of S.cats){const n=Number(v?.[c.id])||0;if(!n)continue;
          const b=(out.by[sid]||={total:0});b[c.id]=(b[c.id]||0)+n;b.total+=n;
          out.day[d]=(out.day[d]||0)+n;out.cat[c.id]=(out.cat[c.id]||0)+n;out.total+=n;}
      }
    }
  }
  return out;
}
function volDays(sid,from,to){
  let n=0;
  for(const [m,doc] of Object.entries(S.months)){
    if(m<from.slice(0,7)||m>to.slice(0,7))continue;
    for(const [d,per] of Object.entries(doc.vol||{})){if(d<from||d>to)continue;const v=per?.[sid];if(v&&S.cats.some(c=>Number(v[c.id])>0))n++}
  }
  return n;
}
function weekdaysIn(f,t){let n=0;for(let d=f;d<=t;d=addDays(d,1))if(!isWE(d))n++;return n}
function preset(p){
  const t=parse(TODAY),y=t.getFullYear(),m=t.getMonth(),w=t.getDay(),mon=addDays(TODAY,w===0?-6:1-w),cm=TODAY.slice(0,7);
  switch(p){
    case'week':return[mon,addDays(mon,6)];
    case'lastweek':return[addDays(mon,-7),addDays(mon,-1)];
    case'month':return[cm+'-01',monthEnd(cm)];
    case'lastmonth':{const lm=addMonths(cm,-1);return[lm+'-01',monthEnd(lm)]}
    case'quarter':{const s=`${y}-${pad(Math.floor(m/3)*3+1)}`;return[s+'-01',monthEnd(addMonths(s,2))]}
    case'year':return[`${y}-01-01`,`${y}-12-31`];
  }
}

const chains={};
function enqueue(path,fn){
  const p=(chains[path]||Promise.resolve()).then(fn).catch(onWriteErr);
  chains[path]=p;return p;
}
function onWriteErr(e){
  const c=e&&e.code;
  if(c==='permission-denied')toast('沒有權限執行這個操作，資料未儲存');
  else if(c==='unauthenticated')toast('登入已過期，請重新登入');
  else if(c==='resource-exhausted')toast('資料庫用量已達上限，請稍後再試');
  else toast('儲存失敗，請檢查網路後再試');
}
function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){a[k]=merge(a[k]&&typeof a[k]==='object'?a[k]:{},b[k])}else a[k]=b[k]}return a}
function writeMonth(m,patch){

  enqueue('months/'+m,()=>db.doc('months/'+m).set(patch,{merge:true}));
}

/* 負責人歷程：每次換負責人就結束前一段、開始新一段，供「任務分析」統計 */
function nextOwners(prev,t){
  let own=Array.isArray(prev?.owners)?prev.owners.map(o=>({...o})):(prev&&prev.staffId?[{staffId:prev.staffId,from:prev.start||prev.created||TODAY,to:''}]:[]);
  const was=prev?.staffId||'',now=t.staffId||'';
  if(was===now){if(!own.length&&now)own=[{staffId:now,from:t.start||TODAY,to:''}];return own}
  if(own.length&&!own[own.length-1].to)own[own.length-1].to=TODAY;
  if(now)own.push({staffId:now,from:prev?TODAY:(t.start||TODAY),to:''});
  return own;
}

  t={...t,owners:nextOwners(S.tasks[t.id],t)};
  const {id,...body}=t;S.tasks={...S.tasks,[id]:t};
  if(db)enqueue('tasks/'+id,()=>db.doc('tasks/'+id).set(body));
}
function delTask(id){
  const n={...S.tasks};delete n[id];S.tasks=n;
  if(db)enqueue('tasks/'+id,()=>db.doc('tasks/'+id).delete());
}

}
/* 登入權限：人員的電子郵件 → roles/{email}；離職或清空信箱即停用 */
const roleKey=e=>String(e||'').trim().toLowerCase();
function syncRole(prev,s){
  if(!db)return;
  const oldE=roleKey(prev?.email),newE=roleKey(s.email),active=!(s.until&&s.until<TODAY);
  if(oldE&&oldE!==newE)enqueue('roles/'+oldE,()=>db.doc('roles/'+oldE).delete());
  if(!newE)return;
  if(active)enqueue('roles/'+newE,()=>db.doc('roles/'+newE).set({role:s.role==='負責人'?'負責人':'成員',staffId:s.id,name:s.name}));
  else enqueue('roles/'+newE,()=>db.doc('roles/'+newE).delete());
}

function parseRoster(txt){
  return txt.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^(.+?)\s*[<＜(（]?\s*([^\s<>()（）]+@[^\s<>()（）]+)\s*[>＞)）]?$/);
    return m?{name:m[1].trim(),email:roleKey(m[2])}:null;
  }).filter(Boolean);
}

  // 本週業務量 + 需要注意

  a+=`</div></section>`;
  return h+`<div class="grid2">${g}${a}</div>`;
}

function taskRows(){
  const f=S.tf,q=f.q.trim().toLowerCase();
  let ts=tasksArr().filter(t=>{
    if(f.who==='none'){if(t.staffId&&S.staff[t.staffId])return false}
    else if(f.who!=='all'&&t.staffId!==f.who)return false;
    if(!f.srcs[taskKind(t)])return false;
    if(f.st==='open'&&t.status==='done')return false;
    if(f.st==='done'&&t.status!=='done')return false;
    if(f.st==='overdue'&&!isOverdue(t))return false;
    if(q&&!(`${t.title} ${t.note||''} ${t.outcome||''}`.toLowerCase().includes(q)))return false;
    return true;
  });
  ts.sort((a,b)=>{
    const ad=a.status==='done',bd=b.status==='done';
    if(ad!==bd)return ad?1:-1;
    if(ad)return (b.doneDate||'')<(a.doneDate||'')?-1:1;
    return (a.due||'9999')<(b.due||'9999')?-1:1;
  });
  if(!ts.length)return `<tr><td colspan="9" class="empty">沒有符合條件的任務。</td></tr>`;
  return ts.map(t=>{
    const o=isOverdue(t),s=S.staff[t.staffId];
    let act='';
    if(P.claim(t))act=`<button class="btn pri" data-act="claim" data-id="${t.id}" ${ro()}>我來接</button>`;
    else if(t.status!=='done'&&P.editTask(t))act=`<button class="btn" data-act="quickDone" data-id="${t.id}" ${ro()}>完成</button>`;
    return `<tr class="click" data-act="task" data-id="${t.id}">
      <td>${stChip(t.status)}${t.status!=='done'?`<div class="prog" title="完成進度 ${t.progress||0}%"><i style="width:${t.progress||0}%"></i></div><div class="mini">${t.progress||0}%</div>`:''}</td>
      <td><div style="font-weight:500">${esc(t.title)}${t.demo?'<span class="demo">示範</span>':''}</div>${t.updated?`<div class="mini">${esc(deciderName(t.updatedBy)||'')} 更新於 ${mdy(t.updated)}</div>`:''}${t.outcome?`<div class="mini" style="white-space:normal;color:var(--ok)">成果：${esc(t.outcome)}</div>`:''}${t.note?`<div class="mini" style="white-space:normal">${esc(t.note)}</div>`:''}</td>
      <td style="white-space:nowrap">${s?esc(s.name)+(s.until&&s.until<TODAY?' <span class="small muted">已離職</span>':''):'<span class="muted">—</span>'}</td>
      <td>${srcChip(t)}</td>
      <td class="small">${esc(t.cat||'')}</td>
      <td class="num small">${mdy(t.start)}</td>
      <td class="num small">${o?`<span class="bad">${mdy(t.due)}</span><div class="mini" style="color:var(--crit)">逾期 ${daysBetween(t.due,TODAY)} 天</div>`:mdy(t.due)}</td>
      <td class="num small">${t.status==='done'?mdy(t.doneDate):''}</td>
      <td class="num">${act}</td></tr>`;
  }).join('');
}

function submitTask(){
  const id=$('taskForm').dataset.id||uid(),title=$('f_title').value.trim();
  if(!title){$('f_title').focus();return}
  const prev=S.tasks[id]||{},lead=P.lead();
  if(prev.id?!P.editTask(prev):!P.newTask())return;
  const status=$('f_status').value,doneDate=status==='done'?($('f_done').value||TODAY):'';
  let staffId,source;
  if(lead){staffId=$('f_staff').value;source=staffId?(modal.querySelector('input[name=f_src]:checked')?.value||'assigned'):''}
  else{staffId=prev.staffId||myStaffId();source=prev.source||'self'}
  const progress=status==='done'?100:Math.min(90,+$('f_prog').value||0);
  if(lead&&staffId&&staffId!==prev.staffId&&staffId!==myStaffId())notify(staffId,`${actorName()}指派任務給你：「${title}」${$('f_due').value?`，預計 ${md($('f_due').value)} 完成`:''}。`,'task',id);
  saveTask({...prev,id,title,staffId,source,cat:$('f_cat').value,status,progress,start:$('f_start').value,due:$('f_due').value,doneDate,note:$('f_note').value.trim(),outcome:$('f_outcome').value.trim(),created:prev.created||TODAY,updated:TODAY,updatedBy:myStaffId()||(S.me.owner?'director':'')});

}

}

/* ---------- 任務分析 ----------
   同名任務視為同一「任務項目」的多次執行；每一段負責期間（owners）算一次執行。 */
const normTitle=t=>String(t||'').trim();
function segmentsOf(t){
  const own=Array.isArray(t.owners)&&t.owners.length?t.owners:(t.staffId?[{staffId:t.staffId,from:t.start||t.created||TODAY,to:''}]:[]);
  return own.filter(o=>o.staffId).map((o,i,arr)=>{
    const last=i===arr.length-1,from=o.from||t.start||t.created||TODAY;
    let state,end;
    if(last&&t.status==='done'&&o.staffId===t.staffId){state='done';end=t.doneDate||o.to||TODAY}
    else if(o.to){state='transferred';end=o.to}
    else{state='open';end=TODAY}
    if(end<from)end=from;
    return{task:t,title:normTitle(t.title),cat:t.cat||'',staffId:o.staffId,from,end,state,
      ontime:state==='done'&&(!t.due||end<=t.due),late:state==='open'&&t.due&&t.due<TODAY,full:daysBetween(from,end)+1};
  });
}
function anaData(){
  const {task,who,from,to}=S.an;
  let segs=tasksArr().flatMap(segmentsOf);
  if(from)segs=segs.filter(x=>x.end>=from);
  if(to)segs=segs.filter(x=>x.from<=to);
  segs.forEach(x=>{const a=from&&x.from<from?from:x.from,b=to&&x.end>to?to:x.end;x.days=b<a?0:daysBetween(a,b)+1});
  return{all:segs,scoped:segs.filter(x=>(!task||x.title===task)&&(!who||x.staffId===who))};
}
function anaAgg(list){
  const done=list.filter(x=>x.state==='done'),n=list.length;
  return{n,done:done.length,open:list.filter(x=>x.state==='open').length,tr:list.filter(x=>x.state==='transferred').length,
    late:list.filter(x=>x.late).length,ontime:done.filter(x=>x.ontime).length,days:list.reduce((a,x)=>a+x.days,0),
    avg:done.length?Math.round(done.reduce((a,x)=>a+x.full,0)/done.length*10)/10:null,
    first:list.reduce((a,x)=>!a||x.from<a?x.from:a,''),last:list.reduce((a,x)=>!a||x.end>a?x.end:a,''),
    people:new Set(list.map(x=>x.staffId)).size};
}

    ${kpi('主動承接・已完成',`${vd}<small>項</small>`,'自行提出或自願認領，並已結案')}
    ${kpi('主動承接・進行中',`${vo}<small>項</small>`,'期間內仍在推動的主動專案')}
    ${kpi('自行提出／認領',`${selfN}<small>/ ${claimN}</small>`,'主動承接的兩種來源')}
    ${kpi('指派任務・已完成',`${ad}<small>項</small>`,'負責人指派並已完成')}
    ${kpi('主動專案類別',Object.keys(byCat).length?`${Object.keys(byCat).length}<small>類</small>`:'—',Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`${esc(k)} ${n}`).join('・')||'尚無主動專案')}
  </div>`;
  h+=`<div class="dl" style="grid-template-columns:repeat(auto-fill,minmax(330px,1fr))">`;
  for(const r of rows){
    h+=`<section class="panel"><div class="ph"><div class="who"><span class="nm">${esc(r.s.name)}</span>${roleTag(r.s)}</div><span class="hint">主動 完成 ${r.volDone.length}・進行中 ${r.volOpen.length}｜指派完成 ${r.asg.length}</span></div><div class="pb">`;
    if(!r.vol.length&&!r.asg.length)h+=`<div class="empty" style="padding:10px">這段期間沒有紀錄。</div>`;
    if(r.vol.length){
      h+=`<div class="agroup" style="padding-left:0">主動承接</div><div class="alist">`;
      h+=r.vol.map(x=>`<button class="aitem" style="grid-template-columns:auto minmax(0,1fr) auto;align-items:start" data-act="task" data-id="${x.id}">
        <span class="chip k-${TASK_SRC[x.source].k}">${x.source==='self'?'自提':'認領'}</span>
        <span style="min-width:0"><span class="t" style="display:block">${esc(x.title)}</span><span class="s" style="white-space:normal">${esc(x.cat||'')}${x.outcome?`・<span style="color:var(--ok)">${esc(x.outcome)}</span>`:''}</span></span>
        <span class="s">${x.status==='done'?'完成 '+mdy(x.doneDate):TASK_ST[x.status]?.l||''}</span></button>`).join('');
      h+=`</div>`;
    }
    if(r.asg.length){
      h+=`<div class="agroup" style="padding-left:0">指派任務完成</div><ul style="margin:0;padding:0;list-style:none;display:grid;gap:2px">${r.asg.map(x=>`<li style="display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 8px"><button class="link" data-act="task" data-id="${x.id}">${esc(x.title)}</button><span class="muted num">${md(x.doneDate)}</span></li>`).join('')}</ul>`;
    }
    h+=`</div></section>`;
  }
  h+=`</div><p class="note">「主動承接」＝成員自行提出（例如跨科研究、院外宣傳）或自願認領開放任務。已完成的依完成日計入期間；進行中的只要在期間結束前已開始就會列出。點任一項可看內容與成果說明。</p>`;
  return h;
}
async function exportAch(){
  const D=achData();
  const q=v=>{v=String(v??'');return /[",\r\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};
  const rows=[[`衛教室工作成就 ${D.f} 至 ${D.t}`],[],['成員','來源','任務','類別','狀態','開始','完成日','成果說明']];
  for(const r of D.rows){
    for(const x of r.vol)rows.push([r.s.name,TASK_SRC[x.source].l,x.title,x.cat||'',TASK_ST[x.status]?.l||'',x.start||'',x.doneDate||'',x.outcome||'']);
    for(const x of r.asg)rows.push([r.s.name,'負責人指派',x.title,x.cat||'','已完成',x.start||'',x.doneDate||'',x.outcome||'']);
  }
  const data='﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n');
  try{await downloads.save({filename:`衛教室工作成就_${D.f}_${D.t}.csv`,data});toast('已匯出')}
  catch(e){if(e?.code==='declined')return;if(e?.code==='rate_limited')toast('請稍候再試');else toast('此環境無法下載檔案')}
}

  }
  $('tabs').innerHTML=VIEWS.map(([k,l])=>`<button class="tab" role="tab" data-act="tab" data-v="${k}" aria-selected="${S.view===k}">${l}</button>`).join('');
  const sy=$('sync');sy.className='sync live';sy.querySelector('span').textContent='即時同步';
  $('todayLbl').textContent='今天 '+longDate(TODAY);
  const rl=roleLabel();$('roleLbl').textContent=rl?'身分：'+rl:'';
  const nu=myNotices().filter(isUnread).length;
  $('bell').innerHTML=`${myStaffId()||P.lead()?`<button class="btn" data-act="openNotices" aria-label="通知，${nu} 則未讀">通知${nu?`<span class="badge">${nu}</span>`:''}</button> `:''}<button class="btn" data-act="logout">登出</button>`;
  if(!S.tfInit&&myStaffId()&&!P.lead()){S.tf.who=myStaffId();S.tfInit=true}
  let b='';
  if(!S.canWrite)b+=`<div class="banner">你目前是檢視權限，可以查看所有資料，但無法修改。</div>`;
  $('banner').innerHTML=b;
  const sx=scrollX,sy2=scrollY;
  const scrollers=[...main.querySelectorAll('.scroll')].map(e=>e.scrollLeft);
  main.innerHTML=({dash:vDash,tasks:vTasks,vol:vVol,stats:vStats,ana:vAna,ach:vAch,set:vSet}[S.view]||vDash)();
  main.querySelectorAll('.scroll').forEach((e,i)=>{if(scrollers[i])e.scrollLeft=scrollers[i]});
  if(scrollY!==sy2)window.scrollTo(sx,sy2);
}

/* ---------- 登入 ---------- */
function vGate(){
  const e=esc(S.authEmail||'');
  if(S.auth==='noconfig')return `<div class="gate"><h2>尚未完成 Firebase 設定</h2><p>請依照 GitHub 儲存庫 README 的步驟建立 Firebase 專案，並把設定填入 <b>firebase-config.js</b>。</p></div>`;
  if(S.auth==='loading')return `<div class="gate"><p style="margin:0">載入中…</p></div>`;
  if(S.auth==='sent')return `<div class="gate"><h2>請到信箱收信</h2><p>登入連結已寄到 <b>${e}</b>。請在<b>這台裝置</b>上打開信件並點連結，即可登入。<br>幾分鐘內沒收到，請檢查垃圾郵件匣。</p><button class="btn" data-act="gateBack">改用其他信箱</button></div>`;
  if(S.auth==='needEmail')return `<div class="gate"><h2>確認你的信箱</h2><p>你在另一台裝置開啟了登入連結，請再輸入一次信箱以完成登入。</p><input class="field" id="gEmail" type="email" autocomplete="email" placeholder="院內電子郵件" value="${e}"><button class="btn pri" data-act="confirmLink">完成登入</button></div>`;
  if(S.auth==='denied')return `<div class="gate"><h2>尚未開通</h2><p>你的信箱 <b>${e}</b> 還沒有列在衛教室名單中。請聯絡負責人在「人員與設定」填入你的信箱後，再重新整理此頁。</p><button class="btn" data-act="logout">登出</button><p class="note" style="margin:16px 0 0">主任第一次使用：<button class="link small" data-act="claimDirector" style="color:var(--accent)">我是主任，進行首次設定</button></p></div>`;
  if(S.auth==='error')return `<div class="gate"><h2>無法登入</h2><p>${esc(S.authErr||'登入連結可能已過期或已使用過，請重新寄送。')}</p><button class="btn" data-act="gateBack">重新登入</button></div>`;
  return `<div class="gate"><h2>登入衛教室戰情室</h2><p>輸入院內電子郵件，系統會寄一封登入連結給你，點連結就能登入，不需要密碼。</p>
  <form id="gateForm"><input class="field" id="gEmail" type="email" autocomplete="email" required placeholder="你的院內電子郵件" value="${e}"><button class="btn pri" type="submit">寄送登入連結</button></form></div>`;
}
async function sendLink(){
  const email=roleKey($('gEmail')?.value);
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('請輸入正確的電子郵件');return}
  try{
    await auth.sendSignInLinkToEmail(email,{url:location.origin+location.pathname,handleCodeInApp:true});
    store.set('hec.email',email);S.authEmail=email;S.auth='sent';render();
  }catch(e){S.auth='error';S.authErr='寄送失敗：'+(e.code==='auth/unauthorized-continue-uri'||e.code==='auth/unauthorized-domain'?'此網址尚未加入 Firebase 的授權網域。':e.message||e.code);render()}
}
async function finishLink(email){
  email=roleKey(email);if(!email){toast('請輸入電子郵件');return}
  try{await auth.signInWithEmailLink(email,location.href);store.set('hec.email',email);history.replaceState(null,'',location.pathname+location.hash)}
  catch(e){S.auth='error';S.authErr='登入連結無效或已過期，請重新寄送。';render()}
}
document.addEventListener('submit',e=>{if(e.target.id==='gateForm'){e.preventDefault();sendLink()}},true);

/* ---------- 啟動 ---------- */
let unsubs=[];
function stopData(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[]}
function startData(user){
  stopData();
  const email=roleKey(user.email);
  S.me={uid:user.uid,email,owner:false,known:true};S.authEmail=email;
  const all=()=>{
    if(unsubs.length>1)return;
    S.auth='in';S.mode='live';render();
    const fail=e=>{if(e&&e.code==='permission-denied'){S.auth='denied';stopData();render()}};
    const col=(name,fn)=>unsubs.push(db.collection(name).onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=fn(d));S[name==='att'?'atts':name]=o;if(name==='staff')S.loaded=true;scheduleRender()},fail));
    const withId=d=>({id:d.id,...d.data()}),plain=d=>d.data();
    col('staff',withId);col('tasks',withId);col('months',plain);col('notices',withId);col('roles',plain);
    unsubs.push(db.doc('config/main').onSnapshot(d=>{const c=d.exists&&d.data().cats;if(Array.isArray(c)&&c.length)S.cats=c;scheduleRender()},fail));
  };
  // 先讀自己的角色：主任直接進入；其他人必須在 roles 名單中
  unsubs.push(db.doc('roles/'+email).onSnapshot(d=>{
    S.myRole=d.exists?d.data():null;
    S.me.owner=S.myRole?.role==='主任';
    if(!S.myRole){S.auth='denied';render();return}
    all();scheduleRender();
  },()=>{S.auth='denied';stopData();render()}));
}
async function init(){
  const cfg=window.FIREBASE_CONFIG;
  if(typeof firebase==='undefined'||!cfg||!cfg.apiKey||/^請/.test(cfg.apiKey)){S.auth='noconfig';render();return}
  firebase.initializeApp(cfg);auth=firebase.auth();const fdb=firebase.firestore();fdb.settings({ignoreUndefinedProperties:true});
  db={collection:n=>fdb.collection(NS+n),doc:p=>fdb.doc(NS+p)};
  S.authEmail=store.get('hec.email')||'';
  render();
  if(auth.isSignInWithEmailLink(location.href)){
    if(S.authEmail)await finishLink(S.authEmail);
    else{S.auth='needEmail';render()}
  }
  auth.onAuthStateChanged(u=>{
    if(!u){stopData();if(S.auth!=='needEmail'&&S.auth!=='error')S.auth='out';S.myRole=null;render();return}
    startData(u);
  });
}
init();
</script>
